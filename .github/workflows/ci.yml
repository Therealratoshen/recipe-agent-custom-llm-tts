name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  backend:
    name: backend (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: server tests
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pytest tests -v

  web:
    name: web (bun)
    runs-on: ubuntu-latest
    env:
      AGENT_BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: web
      - run: bun run verify
        working-directory: web

  windows:
    name: setup + web (windows)
    runs-on: windows-latest
    env:
      AGENT_BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@v2
      - run: bun run setup
      - run: bun run verify:backend
      - run: bun run verify:backend:pytest
      - run: bun run verify:local:fastapi
      - run: bun run verify:local:llm
      - run: bun run verify:web
